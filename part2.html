grp6:{on:["dom"],m:["sys:Полночь. Дверь лавки","ph:[Фото: дверь лавки, семь вмятин по кругу, шесть заполнены перстнями, седьмая тёмная]","Мира: шесть перстней на месте. седьмая вмятина пустая","Тео: ключ Эльма не подходит по размеру. он совсем маленький","Марек: подходит по форме. вмятина как замочная скважина","Агата: седьмой перстень никогда не был кольцом. Орвин спрятал его в ключе, чтобы никто не искал украшение","Мира: на двери выцарапано: «Шесть нот держат песню. Без чего не бывает мелодии, хотя оно само не звучит?»","Тео: это про фасоль?","Мира: нет"],c:[],q:{ph:"Что не звучит?",a:["пауз","тишин"],h:["подумай про ноты на бумаге: там есть знак, который не звучит","седьмой голос молчит не просто так","слово из пяти букв, начинается на «па…», а на нотах его рисуют чёрточкой"],w:["Мира: замок не щёлкнул","Марек: нет. слово короче и тише"],next:"grp7",win:["Тео: ключ сам лёг во вмятину!"],f:{note:"Седьмой перстень оказался ключом Эльма. Дверь лавки открылась словом «пауза»: седьмой голос это тишина между нотами."}}},

grpEk:{ep:'agataEp4',m:["sys:На старом прилавке лавки вы раскладываете тёплый пирог дома Яблоня и ставите семь чашек чая с корицей","Шесть перстней согреваются от пара, и в седьмой чашке отражаются две улыбающиеся тени: старого учителя и его ученика","Тео: впервые за триста лет тут пахнет не морозом, а корицей и домом","Агата: вот чем на самом деле снимают самые древние проклятия. теплом и общим столом","{R}: кажется, я впервые за год хочу, чтобы скорее наступило завтра","sys:В личных чатах друзей появились новые утренние сообщения","sys:Концовка «Чашка». Конец части 2. Спасибо, что играли"],c:[]},
grpE1:{ep:'agataEp1',m:["sys:Семь знаков на двери лавки вспыхивают мягким светом. На седьмом этаже замка тяжёлая рама наконец отпускает своего узника","Агата: он шагнул ко мне из света и обнял. впервые за пятьдесят лет я могу произнести его имя вслух, и память не стирается","Агата: Орвин. Орвин. мой старый друг","Мира: он посмотрел на наши перстни и улыбнулся, когда уходил вместе с Эльмом","Тео: медный ключ в ладони стал просто тёплым ключом и больше не дрожит","Марек: седьмая вмятина на двери лавки побелела, как остальные шесть. проклятие снято навсегда","{R}: спасибо тебе, {n}. за то, что мы прошли этот путь вместе","sys:В личных чатах друзей появились новые утренние сообщения","sys:Концовка «Свобода». Конец части 2. Спасибо, что играли"],c:[]},
grpE2:{ep:'agataEp2',m:["sys:Перстень Тишины растворяется в тёплом золотистом свете. На экране телефона иконка совы тихо взмахивает крыльями на прощание","Тео: ключ рассыпался тёплой золотой пылью. но мне не грустно, Эльм выглядел таким счастливым","Мира: Эльза Ренн всю жизнь ждала младшего брата. теперь их история в хрониках наконец дописана","Агата: а Орвин решил остаться хранителем на седьмом этаже, но уже по доброй воле. мы будем приходить к нему с чаем","Марек: я зайду к нему во вторник после уроков. расскажу, что лавка снова открыта","sys:В личных чатах друзей появились новые утренние сообщения","sys:Концовка «Дом». Конец части 2. Спасибо, что играли"],c:[]},
