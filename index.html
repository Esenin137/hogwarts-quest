p1:{i:"p1",t:["Платформа девять и три четверти пахнет углём и корицей. Чемодан тяжёл, сова обижена, паровоз уже дышит паром. Вы, {n}, первокурсни[ца|к], и до отправления пять минут.","Что делаете?"],c:[["Помочь плачущему малышу найти сбежавшую жабу","p2","kind","","Жаба нашлась в чужой шляпе. Малыш, шмыгая носом, представился: Тео Бриггс.","",function(){fr("teo",2)}],["Затеряться в толпе и подслушать старшекурсников","p2","cunning","","До вас долетает: в этом году «что-то скребётся за стенами» и на седьмой этаж лучше не ходить."],["Сверить маршрут по справочнику, купленному вчера","p2","wit","","На последней странице мелкая пометка: лестницы замка любят менять маршрут по ночам."],["Первым запрыгнуть в вагон, место у окна ваше","p2","brave","","Кондуктор подмигивает: смелым везёт. Лучшее место у окна достаётся вам."]]},
train:{i:"train",t:["Поезд мчится на север. Напротив сидят Мира Ольхова с книгой толще её руки и Тео Бриггс, у которого в кармане шуршит ручная белая мышь.","Внезапно стёкла затягивает инеем, лампы гаснут, а в коридоре кто-то шепчет ваше имя."],c:[["Распахнуть дверь и шагнуть в темноту","castle","brave","","В коридоре пусто. На полу тает иней, складываясь в одно слово: «Скоро»."],["По узору инея вычислить, откуда идёт холод","castle","wit","","Холод шёл от последнего купе, где, по словам кондуктора, никто не ездил уже лет сорок."],["Успокоить Тео, который дрожит всем телом","castle","kind","","Тео перестаёт дрожать и отдаёт вам половинку шоколадной лягушки. Мира молча подвигается ближе.","",function(){fr("teo",1);fr("mira",1)}],["Притвориться спящим и следить сквозь щёлку","castle","cunning","","Сквозь щёлку вы видите тень без хозяина: она скользнула к последнему вагону."]]},
castle:{i:"lake",t:["Свет вернулся так же внезапно, как пропал, и никто, кроме вас, шёпота не слышал.","В Хогсмиде первокурсников сажают в лодки. Лодки сами скользят по чёрному озеру, а впереди растут башни, и окна в них горят, как рассыпанные угли. Мира шепчет, что озеро глубже, чем кажется.","И вдруг лодку резко качает: из чёрной воды выныривает мокрое щупальце и ощупывает борт."],c:[["Хлопнуть щупальце веслом","gate","brave","","Щупальце обиженно уплывает, а лодка дрожит от вашего боевого клича."],["Придержать Тео и Миру, чтобы никто не выпал","gate","kind","","Вы вцепились в обоих, и лодка выровнялась. Тео шепчет «спасибо» и прячет мышь поглубже."],["Заметить, что щупальце хватает блестящее, и снять пряжку","gate","wit","","Вы бросаете пряжку в воду, щупальце хватает её и исчезает. Мира смотрит с уважением."],["Подкинуть за борт чужую блестящую заколку","gate","cunning","","Заколка булькает, щупальце уходит за ней. Хозяйка ничего не заметит… пока."]]},
hat:{i:"hall",t:["Большой зал: тысяча свечей парит под потолком, четыре стола гудят, а на табурете сидит потрёпанная шляпа. Профессор вызывает вас по имени. Шляпа опускается на глаза.","«Хм… — говорит она. — Любопытно. Очень любопытно. Кто-то уже оставил на тебе след. Но об этом позже».","Шляпа думает долго."],c:[["Прислушаться к шляпе","hat1"]]},
hall:{i:"hall",t:function(){var k=fac();return["«"+F[k][0]+"!» — выкрикивает шляпа, и "+F[k][1]+".","Шляпа добавляет: «"+EX[k]+"».","Мира и Тео машут вам с другого конца зала. Ужин волшебный, пудинги не заканчиваются, но слова шляпы про «след» не выходят из головы."]},c:[["Подняться в спальню","dlg2"]]},
night:{i:"night",t:["Ночью в спальне не спится. Из коридора под дверью пробивается золотистый свет. Вы выглядываете: гобелен на стене слегка колышется, хотя сквозняка нет, а лестница, что вечером вела вниз, теперь уходит в пустоту.","Что-то в замке происходит, и заметили это, похоже, только вы."],c:[["Пойти на свет в одиночку","corridor","brave"],["Разбудить сосед[ку|а] по комнате и позвать с собой","corridor","kind"],["Зарисовать движение лестниц и найти закономерность","corridor","wit"],["Затаиться и проследить, кто включает свет","corridor","cunning"]]},

lesson:{i:"lesson",t:["На трансфигурации профессор Вейл, сухая, как старый пергамент, велит превратить спичку в иголку. У вас выходит спичка с ушком: смешно, но шить ею нечем.","Тео уже справился и самодовольно поглядывает на вас."],c:[["Повторить медленно, разбирая каждый жест","lesson2","wit","","Ошибка была в третьем взмахе. Спичка стала тонкой острой иглой. Профессор приподнимает бровь, а это высшая похвала."],["Пошутить над собой, и класс смеётся вместе с вами","lesson2","kind","","Класс хохочет, профессор улыбается краешком губ, а Мира подсказывает жест, который вы пропустили.","",function(){fr("mira",1)}],["Рискнуть и добавить свой взмах палочкой","lesson2","brave","","Палочка вспыхивает, и игла получается с огоньком на кончике. «Не повторять, — сухо говорит профессор. — Но запомню»."],["Незаметно взять готовую иглу с соседнего стола","lesson2","cunning","cheat","Игла в вашей руке, профессор ничего не заметила. Но Тео, сидящий сзади, заметил."]]},
library:{i:"library",t:["Вечером в библиотеке на вашем столе оказывается книга без названия. На форзаце ваше имя и строчка: «Не верь портрету на седьмом этаже».","Чернила ещё влажные, а на седьмом этаже вы сегодня не были."],c:[["Бежать на седьмой этаж прямо сейчас","fl7","brave","","Лестницы пытаются вас запутать, но вы бежите быстрее. Седьмой этаж встречает тишиной."],["Показать книгу Мире и Тео","fl7","kind","","Мира узнаёт чернила: серебряная соль, так писали триста лет назад. Тео вызывается идти с вами.","",function(){fr("mira",1);fr("teo",1)}],["Изучить чернила и почерк","fl7","wit","","Почерк вашей руки, но слова не ваши: автор подражал вам. Это писал тот, кто умеет копировать."],["Спрятаться за стеллажом и подождать автора","fl7","cunning","","Никто не пришёл. Зато на форзаце проступила вторая строка: «Он лжёт про дверь»."],["Нажать на светящийся корешок в глубине зала","sr0","","","Корешок щёлкает, и шкаф бесшумно отъезжает в сторону.","!sr"]]},
portrait:{i:"portrait",t:["На седьмом этаже висит портрет волшебника Орвина Мглистого. Он улыбается вам, как старому знакомому.","«Я заперт здесь триста лет, — говорит он. — Открой проход за моей рамой, и я научу тебя магии, о которой забыли даже директора».","За рамой темнеет проём, и из него тянет тем самым инеем из поезда."],c:[["Принять сделку и поторговаться об условиях","e_deal","cunning"],["Позвать друзей и закрыть проход вместе","e_friends","kind","","","",function(){fr("mira",2);fr("teo",2)}],["Разгадать узор на раме и запечатать проём","e_seal","wit"],["Вызвать Орвина на дуэль","e_duel","brave"]]},
e_deal:{e:1,i:"portrait",t:function(){return[(ok("cunning")?"Вы выторговали честные условия: Орвин учит вас, но клятва связывает и его. Годы спустя вас назовут [самой хитрой волшебницей|самым хитрым волшебником] школы, и никто не поймёт, где кончается сделка.":"Орвин оказался хитрее. Проём открылся, иней дошёл до коридоров, и последствия вы будете разгребать не один год. Зато урок усвоен.")+iu("cunning","Пуговица с совой в вашем кармане оказалась парой к пуговице на мантии Орвина: он признал в вас равного.")]}},
e_friends:{e:1,i:"portrait",t:function(){return[(ok("kind")?"Мира, Тео и полшколы, с которой вы успели подружиться, держат печать вместе. Иней отступает, Орвин замолкает. Теперь он рассказывает сказки первокурсникам.":"Друзей пришло мало и поздно. Проём закрыт, но ценой порванных мантий и двух месяцев отработок. Зато вы больше не одиноки.")+iu("kind","Светлячок из банки вёл тех, кто боялся темноты.")+(S.cheat?" Правда, Мира долго смотрит на вас: про чужую иглу она не забыла.":"")]}},
e_seal:{e:1,i:"portrait",t:function(){return[(ok("wit")?"Узор на раме оказался нотной записью. Вы сыграли её задом наперёд, и проём затянулся. Профессор Вейл молча кладёт вам на стол иголку. Настоящую.":"Вы почти разгадали узор, но не хватило одной строки. Проём закрыт лишь на время, а в вашей тетради лежит самая интересная задача года.")+iu("wit","Схема лестниц подсказала, что седьмая нужна как последний знак.")]}},
e_duel:{e:1,i:"portrait",t:function(){return[(ok("brave")?"Вспышка, звон рамы, и Орвин хохочет, признавая поражение. Проход заперт, а вы лежите в больничном крыле с опалёнными бровями и славой на весь замок.":"Рама треснула, Орвин исчез, а проём остался. Вы очнулись в больничном крыле. Что было дальше, станет темой второго курса.")+iu("brave","Ключ с вензелем дрогнул в кармане и отвёл заклятие.")]}}

G.p0={i:"station",t:["Вы стоите на вокзале Кингс-Кросс с тяжёлой тележкой. Между платформами девять и десять высится обычная кирпичная колонна. Мимо проходит семья с совой в клетке, подмигивает вам и исчезает в кирпиче.","Бабушка останавливается в двух шагах от колонны. «Дальше без меня, — говорит она. — Я дала слово не возвращаться. Просто не сбавляй шаг: колонна не любит сомневающихся». Выглядит безумно, но именно этого от вас и ждут."],x:[["Постучать по кирпичам","Кирпич как кирпич. Прохожий косится на вас, и вы делаете вид, что проверяете прочность вокзала."],["Заглянуть в чужую тележку","Там клетка с недовольным котом и мешок конфет. Кот шипит: личное пространство для него святое."]],c:[["Разбежаться и пройти сквозь колонну","p1"]]};
G.p2={i:"p1",t:["Остались последние минуты. Перрон гудит: родители машут платками, кто-то роняет сундук, сова над головой выписывает круг.","Пора занимать место в поезде."],x:[["Купить сладости у тележки","Продавщица даёт пакетик тыквенной пастилы. Она тянется, как резина, и на вкус как тыква, которая всё знает.","sweet",.5,"Одна пастилка выпадает на ладонь и не липнет к пальцам. Вы прячете её в карман."],["Погладить сову","Сова клюёт вас в палец и смотрит с осуждением. Она явно считает, что вы не её хозяин."],["Прочесть табло","Все поезда прибывают вовремя, а ваш отмечен тёплой сургучной печатью. Больше ничего."]],c:[["Войти в вагон","comp"]]};
G.comp={i:"train",t:["Поезд тронулся. В купе пахнет кожей и дымом. Напротив устраиваются двое: Мира Ольхова с книгой толще её руки и Тео Бриггс, у которого в кармане шуршит ручная белая мышь.","За окном проплывают холмы, овцы и столбы, и всё это кажется нереальным."],x:[["Заглянуть в багажную сетку","Среди чемоданов лежит чей-то забытый шарф. Он пахнет лавандой и ничего больше не рассказывает.","scarf",.5,"Шарф почти сполз с полки. Вы решаете забрать его: хозяин не объявится."],["Пошарить в карманах мантии","Фантик, перо и страничка с рецептом, которого вы не помните. Ничего полезного."],["Спросить Миру о книге","«Это об истории замка, — отвечает она. — Про седьмой этаж там почти ничего нет, и это странно»."]],c:[["Смотреть в окно","dlg1"]]};
G.gate={i:"gate",t:["Лодки утыкаются в каменную пристань. Вверх ведут сырые ступени, а наверху ждут чугунные ворота с кабанами на столбах. Над головой висит замок, огромный, как гора.","Холодно, и озеро за спиной тихо плещется, будто комментирует каждый ваш шаг.","Ворота заперты, а староста с фонарём опаздывает. В толпе кто-то уже всхлипывает."],x:[["Потрогать кабана на воротах","Камень холодный и шершавый. Кабан безразлично смотрит поверх вас: статуи видали первокурсников и получше."],["Заглянуть в чёрную воду","Вы видите своё отражение и на миг ещё чьё-то, за плечом. Моргаете, и оно пропадает."],["Зачерпнуть воды из озера","Вода ледяная и пахнет мхом. Мира вежливо предлагает не пить это.","vial",.4,"Вы набираете воду в пустую склянку из кармана. Мира вздыхает, но молчит."]],c:[["Громко постучать и потребовать открыть","hat","brave","","Эхо разлетается по двору, и ворота со скрипом отворяются. Сторож недовольно ворчит."],["Утешить малыша, который всхлипывает","hat","kind","","Вы отдаёте ему шарфик и сидите рядом. К приходу старосты он уже улыбается."],["Заметить, что кабаны повёрнуты неправильно, и отпереть замок самому","hat","wit","","Вы поворачиваете каменные головы, и замок щёлкает. Староста смотрит с подозрением."],["Протиснуться в щель и первым занять место","hat","cunning","","Вы проскальзываете внутрь, пока остальные спорят."]]};
G.dorm={i:"dorm",t:["Это спальня [девочек|мальчиков]: круглая, с узкими окнами и пятью кроватями. Ваш сундук уже стоит у изголовья, а на подушке лежит шоколадная лягушка.","Лягушка подмигивает и сбегает за кровать."],x:[["Открыть свой сундук","Всё на месте: учебники, носки, письмо от мамы. И фантик от конфеты, которой вы не покупали.","wrap",.6,"Фантик оказался бумажкой с золотой печатью в форме песочных часов. Вы забираете её."],["Выглянуть в окно","Внизу чёрное озеро и луна. Над водой что-то блеснуло, но вы так и не поняли что."],["Погнаться за лягушкой","Она ловко ускользает под соседнюю кровать. Сосед[ка|] спит и, к счастью, ничего не заметил[а|]."]],c:[["Лечь спать","night"]]};
G.class0={i:"lesson",t:["Класс трансфигурации высокий и холодный. На доске написано слово, а за кафедрой дремлет полосатый кот.","Кот открывает один глаз, и вы вдруг уверены, что это не просто кот."],x:[["Почесать кота","Кот терпит две секунды, потом потягивается и уходит. Или это был не кот, вы не уверены."],["Прочесть слово на доске","Буквы сами складываются в «Терпение». Вы решаете, что это совпадение."],["Выглянуть в окно","Во дворе мокнут клумбы, а на одной растёт лиловая шишка, и она явно за вами наблюдает.","cone",.5,"Шишка отваливается сама, будто хочет уйти с вами. Вы прячете её в карман."]],c:[["Занять место за партой","lesson"]]};
G.lib0={i:"library",t:["Библиотека длиннее, чем вы ожидали. Шкафы уходят в сумрак, лампы горят тусклее, если рядом шумят. Библиотекарь не отрывается от каталога и не удостаивает вас взглядом.","Где-то в глубине кто-то шуршит страницами."],x:[["Взять книгу из ближнего шкафа","Вы берёте «Домашние духи и как их не обидеть». Книга обиженно захлопывается и сама ставит себя обратно."],["Покрутить глобус","Страны на нём слегка шевелятся, а одна называется «Здесь не ищите». Вы послушно не ищете."],["Заглянуть в каталог","Карточка на ваше имя есть, но пуста. Библиотекарь резко закрывает ящик."]],c:[["Сесть за стол у окна","library"]]};
G.fl7={i:"fl7",t:["Седьмой этаж пуст и тих. Пахнет пылью и старым воском, а факелы горят холодным светом. В конце длинного коридора виден портрет.","Пол поскрипывает под ногами, будто предупреждает."],x:[["Присмотреться к пыли на полу","Следы ведут только в одну сторону, к портрету. Обратных нет.","salt",.5,"В пыли блестит серебристая крупинка. Вы собираете щепотку в платок."],["Прикоснуться к факелу","Огонь холодный и не греет. Он потрескивает насмешливо."],["Прислушаться к стене","За камнем тихо шумит что-то вроде ветра. Вы на всякий случай отходите."]],c:[["Подойти к портрету","portrait"]]};
G.castle.x=[["Прислушаться к тишине","Кроме плеска вёсел слышен далёкий звон, будто где-то поют стёкла. Лодки плывут сами, и спросить некого."],["Пересчитать окна замка","Вы дошли до двухсот сорока, и они начали зажигаться. Счёт сбился."]];
G.hat.x=[["Осмотреть потолок","Потолок притворяется ночным небом. Вы почти уверены, что звёзды настоящие, но спросить стесняетесь."],["Разглядеть шляпу","Она потёрта, залатана и, кажется, слегка зевает. На шве вышита чья-то давняя буква."]];
G.hall.x=[["Попробовать пудинг","Пудинг тёплый и сладкий, если не считать того, что он слегка кивнул в ответ."],["Поглядеть на призраков","Серебристый монах проплывает сквозь стол, и пудинг дрожит. Призрак извиняется, но не слишком."]];
G.c2a={i:"tunnel",t:function(){var m={e_deal:"Орвин в раме довольно шепчет: «Иди прямо, дитя. Дальше сам не вижу». Но голос его звучит тоньше, чем раньше.",e_friends:"Мира держит факел, Тео прижимает к груди мышь. Втроём не так страшно, хотя иней трещит громче, чем хотелось бы.",e_seal:"Проём запечатан, но из-под рамы тянет холодом. Рядом вы приподнимаете угол гобелена: за ним лестница вниз.",e_duel:"Рама обуглена, и Орвин, из последних сил усмехаясь, показывает глазами внутрь: «Идёшь? Тогда быстрее»."};return["Глава третья. "+(m[S.path]||m.e_seal),RL(),"Ход уходит под замок. Стены покрыты инеем, а с потолка свисают сосульки, похожие на зубы."]},x:[["Потрогать иней","Иней обжигает холодом и тает от тепла рук. Под ним старая кладка, и больше ничего."],["Рассмотреть сосульки","Они мелодично звенят, когда вы проходите. Лучше не шуметь, но поздно."]],c:[["Зажечь Люмину и осветить ход","c2g","wit","u_spell","Шарик света плывёт вперёд и озаряет инистый ход до самой галереи.","sp"],["Идти вперёд при свете палочки","c2g","brave","","Свет прыгает по стенам, и тени двигаются чуть быстрее вас."],["Идти по следам на инее","c2g","wit","","Следы маленькие, как у лисицы, только с тремя когтями. Лисицы так не ходят."],["Закрыть лицо лавандовым шарфом и красться","c2g","cunning","u_scarf","Шарф глушит холод и запах. Тот, кто внизу, вас не учует.","scarf"],["Тихо позвать: «Кто здесь?»","c2g","kind","","Эхо отвечает не вашим голосом: «Помоги». Похоже, внизу не враг."]]};
G.c2b={i:"clock",t:["Ход выводит в круглый зал. Посреди висят огромные песочные часы, и песок в них застыл на полпути. На полу золотом очерчены три знака, а в стене пустая ниша ждёт чего-то круглого.","Что-то должно запустить время."],x:[["Подойти к часам","Часы холодные, как лёд. Песок чуть шевелится при вашем приближении."],["Посмотреть на потолок","Там нарисовано небо, и звёзды мигают не в такт. Одна подмигивает лично вам."]],c:[["Осветить зал Люминой и разглядеть знаки","c2m","wit","u_spell","Свет скользит по полу, и знаки складываются в узор, похожий на стрелку.","sp"],["Настроить компас времени по золотым знакам","c2m","wit","u_compass","Стрелка сама находит нужный знак. Часы щёлкают, и песок трогается.","compass"],["Приложить бумажку с золотой печатью к нише","c2m","wit","u_wrap","Печать сошлась с отпечатком в нише. Часы тихо щёлкнули, и песок тронулся.","wrap"],["Посыпать солью знаки на полу","c2m","wit","u_salt","Соль заискрилась и растопила иней. Знаки читаются: «Помни, а не бойся».","salt"],["Выбить нишу рукоятью палочки","c2m","brave","","Часы вздрагивают, песок сыплется быстрее, чем нужно, и зал дрожит. Но проход открыт."],["Подождать, пока время тронется само","c2m","kind","","Вы ждёте, и песок понемногу трогается: время любит тех, кто его не гонит."],["Прокрасться вдоль стены мимо знаков","c2m","cunning","","Вы идёте по краю, не касаясь знаков, и часы вас не замечают."]]};
G.c2c={i:"cave",t:["В конце хода маленькая пещера. В ней свернулся зверёк из инея и тумана, похожий на лисёнка с тремя когтями. Он дрожит. На постаменте бьётся, как сердце, холодный голубой огонёк, и от него расползается мороз.","Зверёк поднимает морду и смотрит прямо на вас."],x:[["Присмотреться к огоньку","Огонёк пульсирует в такт вашему сердцу. Это не оружие и не клад, это чей-то запертый страх."],["Протянуть руку зверьку","Он принюхивается к пальцам и немного успокаивается. Пока ничего не меняется."]],c:[["Сотворить тёплый свет, чтобы лисёнок не боялся","c2d","kind","u_spell","Золотистый шарик повисает над лисёнком. Тот перестаёт дрожать и тянется к теплу.","sp"],["Угостить зверька тыквенной пастилой","c2d","kind","u_sweet","Лисёнок осторожно берёт пастилу и впервые не дрожит. Он идёт за вами, как за старым другом.","sweet"],["Бросить лиловую шишку в сторону, чтобы отвлечь","c2d","cunning","u_cone","Шишка катится, лисёнок бросается за ней, а у вас появляется минута без присмотра.","cone"],["Выплеснуть озёрную воду на огонёк","c2d","wit","u_vial","Вода шипит, и холодный огонь на миг гаснет. Мороз отступает от стен.","vial"],["Шагнуть к огоньку открыто, с палочкой","c2d","brave","","Мороз бьёт по лицу, но вы подходите вплотную и видите: огонёк пульсирует страхом, а не злобой."],["Сесть рядом со зверьком и молчать","c2d","kind","","Вы сидите молча. Лисёнок кладёт голову вам на колено."]]};
G.c2g={i:"gallery",t:["Ход расширяется в галерею. В лёд вморожены портреты. Везде один и тот же мальчик лет двенадцати с взъерошенными волосами, а рядом то усмехается, то хмурится молодой волшебник. Вы узнаёте Орвина.","На табличке под первой рамой выведено: «Лучший ученик седьмого этажа». Имя стёрто льдом."],x:[["Протереть табличку рукавом","Лёд не поддаётся. Остаётся одна буква «Э» и больше ничего."],["Осмотреть рамы","Все рамы целые и холодные. Ничего особенного.","medal",.55,"Под одной рамой застрял медальон на цепочке с вырезанной лисой. Вы забираете его."],["Подышать на портрет","Мальчик в раме на миг подмигивает. Вы вздрагиваете, а он снова позирует серьёзно."]],c:[["Изучить подписи под рамами","c2l","wit","","Подписи складываются в историю: ученик, лучший, смелый, потом пустые рамы. Последняя подпись: «Он упал»."],["Рассмотреть последнюю раму вблизи","c2l","brave","","На ней башня, падающий мальчик и Орвин с поднятой палочкой. Время на картине застыло."],["Прислушаться к тишине галереи","c2l","cunning","","Тишина здесь не пустая: где-то впереди тихо скулит что-то живое."],["Постоять и подумать о мальчике","c2l","kind","","Вам становится грустно за человека, который так долго был один."]]};
G.c2l={i:"stairs",t:["Галерея кончается лестницей вниз. Ступени покрыты гладким льдом и блестят, как стекло. Внизу темнее, а вдали что-то мерцает голубым."],x:[["Бросить вниз камешек","Он скользит и скользит, и вы так и не слышите, как он остановился."],["Заглянуть за край","Перил нет. Есть пропасть и ваше отражение вверх ногами."]],c:[["Посыпать ступени серебряной солью","c2b","wit","u_salt","Соль въедается в лёд, ступени шершавеют, и вы спускаетесь легко.","salt"],["Спуститься боком, держась за стену","c2b","cunning","","Медленно, но без падений. Иней на стене рисует узор вашей ладони."],["Съехать по лестнице, как по горке","c2b","brave","","Вы летите вниз и приземляетесь в сугроб. Весело, но шумно: в зале внизу что-то зазвенело."],["Расчистить ступени рукавом для идущих следом","c2b","kind","","Работа долгая, но вы вдруг понимаете: кто-то пойдёт здесь после вас, и так лучше."]]};
G.c2m={i:"gears",t:["Часы в зале сдвигаются, и в стене открывается проход в зал шестерён. Гигантские колёса из латуни и льда стоят неподвижно. Над ними торчит рычаг, а в большом зубчатом колесе не хватает одной шестерёнки."],x:[["Покопаться среди шестерёнок","Всё приросло ко льду. Пальцы мёрзнут, и больше ничего.","gear",.55,"Одна шестерёнка сидит свободно. Вы вынимаете её."],["Прочесть табличку","«Время нельзя остановить, его можно лишь заморозить». Вы чувствуете, что это неспроста."]],c:[["Вставить латунную шестерёнку","c2n","wit","u_gear","Колесо захватывает зубья, и вся махина тихо трогается. Лёд сходит со стен.","gear"],["Налечь на рычаг изо всех сил","c2n","brave","","Рычаг поддаётся со стоном, механизм крутится рывками."],["Согреть колёса дыханием и ладонями","c2n","kind","","Лёд на зубьях медленно тает. Работа тягучая, но честная."],["Просчитать, как колёса зацепляют друг друга","c2n","wit","","Вы находите ключевое колесо и толкаете его вручную. Всё трогается."]]};
G.c2n={i:"tunnel",t:["Из машинного зала уходит узкий тоннель. На инее чётко видны отпечатки трёхпалых лап. Рядом разбросаны ледяные игрушки: шарик, свисток, крохотный меч. Кто-то здесь очень давно играл.","Впереди слышно тихое поскуливание."],x:[["Поднять ледяной шарик","Шарик тает в руке и оставляет мокрое пятно, пахнущее детством."],["Подуть в свисток","Раздаётся тонкий звук, и поскуливание на секунду стихает, потом возобновляется."],["Осмотреть деревянный меч","Он вырезан из дерева, а не из льда. На рукояти буква «Э»."]],c:[["Идти по следам, не прячась","c2c","brave","","Шаги гулко отдаются в тоннеле. Впереди кто-то замер."],["Красться вдоль стены","c2c","cunning","","Вы подходите бесшумно и видите пещеру раньше, чем она видит вас."],["Тихо напевать, чтобы не напугать","c2c","kind","","Напев разносится эхом, и поскуливание стихает: кто-то прислушивается."],["Разобрать следы по порядку","c2c","wit","","След идёт и туда, и обратно: зверёк ходит здесь веками, по кругу."]]};
G.c2d={i:"cave",t:function(){var f=S.last==="kind";return[f?"Лисёнок осторожно тянет вас за рукав вглубь пещеры, к нише, где мерцает слабый свет.":"Лисёнок вас не подпускает, но огонёк отражается в его глазах, и в этом отражении вы замечаете нишу в стене.","В нише оживает воспоминание: ученик Эльм смеётся на краю башни, а Орвин показывает ему запретное заклинание. Эльм оступается. Орвин останавливает время, но не может его вернуть.","Лисёнок и огонёк — всё, что осталось от них двоих: эхо мальчика и страх старика."]},x:[["Дотронуться до картины","Стекло воспоминания холодное и дрожит, будто в нём бьётся пульс."],["Осмотреть нишу","На полке крошечная записка: «Прости, Эльм». Бумага рассыпается от прикосновения."]],c:[["Прислушаться к лисёнку","c2e","kind","","Лисёнок тихо тявкает: он помнит имя, но боится его произнести."],["Подойти к огоньку и всмотреться","c2e","wit","","В огоньке дрожит обрывок заклинания. Если его сложить, страх можно распутать."],["Отступить и придумать план","c2e","cunning","","Вы замечаете: огонёк слушается лисёнка, а значит, им можно управлять."],["Смотреть на падение до конца","c2e","brave","","Вы не отворачиваетесь. Огонёк на миг гаснет, признавая вас."]]};
G.c2e={i:"cave",t:["Огонёк пульсирует всё слабее. Лисёнок смотрит то на него, то на вас. Теперь вы знаете всё: время замёрзло из-за страха Орвина, а мальчик так и не дождался прощения.","Решать вам."],c:[["Показать лисёнку компас: время пойдёт дальше","fin","wit","u_compass2","Стрелка качнулась к огоньку, и тот потянулся к ней, как к старому знакомому.","compass"],["Надеть медальон лисёнку и вернуть огоньку память","fin","kind","u_medal","Медальон на тонкой цепочке ложится лисёнку на грудь. Огонёк тянется к нему.","medal"],["Назвать имя ученика и сложить историю воедино","fin","wit","","Вы произносите: «Эльм». Пещера замирает."],["Остаться рядом и обнять лисёнка","fin","kind","","Лисёнок утыкается носом вам в ладонь. Мороз отступает на шаг."],["Вынести лисёнка и огонёк тайком","fin","cunning","","Вы прячете огонёк в шарф, а лисёнок сам прыгает вам в руки."],["Разбить огонёк рукой","fin","brave","","Вы замахиваетесь, и стекло звенит, как лёд на весеннем озере."]]};
G.fin={e:2,i:"cave",t:function(){var u=Object.keys(S).filter(function(k){return k.indexOf("u_")===0}).length,m={kind:S.u_medal?"Вы надеваете медальон лисёнку. Огонёк тянется к нему, как к другу, и на миг лисёнок становится мальчиком с взъерошенными волосами. Он смеётся и рассыпается светом, а холод уходит из стен. В портрете Орвин впервые за триста лет молчит и улыбается.":"Вы остаётесь рядом, пока огонёк не гаснет сам, а лисёнок не засыпает у вас на коленях. Холод уходит, но эхо ученика остаётся в замке как друг.",wit:"Вы называете имя: «Эльм». Огонёк вздрагивает, лисёнок поднимает голову, и два осколка одной истории складываются воедино. Страх теряет хозяина и тает. Часы наверху наконец показывают верное время.",cunning:"Вы выносите лисёнка и огонёк в шарфе, никого не разбудив. Холод ушёл из хода, но не из ваших карманов: теперь у вас тайна размером с лису. Орвин об этом не знает.",brave:"Вы разбиваете огонёк рукой. Мороз отступает, но вместе с ним исчезает лисёнок, и вам долго будет слышаться его тихий лай. Победа вышла дорогой."}[S.last];
return[m,"Вы возвращаетесь в спальню на рассвете. Предметов найдено: "+S.items.length+", использовано: "+u+".","Но утро уже близко, а у портрета на седьмом этаже остался неразрешённый разговор."]}};

G.r7={i:"portrait",t:["На седьмом этаже {R} достаёт палочку и направляет её на раму Орвина. Тот молчит, и в его глазах впервые читается усталость, а не насмешка.","«Он забрал Эльма. Я сожгу эту раму, — голос {R} срывается. — А вы либо со мной, либо нет».","Палочка дрожит. У вас есть несколько секунд."],x:[["Посмотреть на Орвина","Он не просит пощады. Он просто ждёт, как человек, давно решивший, что заслужил."]],c:[["Рассказать, что вы знаете об Эльме и раскаянии Орвина","r8","wit","","Вы говорите быстро и честно, и палочка в руке {R} медленно опускается.","",function(){S.rel=S.trust>=2?"ally":"doubt"}],["Выбить палочку из руки {R}","r8","brave","","Палочка звякает об пол. {R} смотрит на вас как на предателя.","",function(){S.rel="rift"}],["Помочь: пусть Орвин ответит за всё","r8","cunning","","Вы поднимаете палочку вместе с {R}. Рама вспыхивает, и Орвин вскрикивает.","",function(){S.rel="dark"}],["Встать рядом с {R} и молча взять за плечо","r8","kind","","{R} вздрагивает, но не отстраняется.","",function(){S.rel=S.trust>=1?"ally":"doubt"}]]};

G.v1={i:"castle",t:function(){return["Прошло несколько дней. Ледяной ход остался позади, замок снова шумит, а Орвин в портрете, говорят, стал вежливее.",S.love>=3?"Вы с {R} теперь почти не расстаётесь, и вам обоим это нравится.":S.love>=1?"Вы с {R} стали проводить вместе всё больше времени.":"Вы с {R} держитесь осторожно, но по-прежнему рядом.","Вечером {R} зовёт вас на галерею над озером и достаёт маленький кулон в форме песочных часов на серебряной цепочке: «Он принадлежал Эльзе. Хочу, чтобы он был у вас»."]},x:[["Оглядеться","Галерея открыта ветру, озеро внизу тёмное и спокойное. На другом берегу светится одинокий огонёк."]],c:[["Принять кулон и сразу надеть","v1a","","","{R} застёгивает цепочку, пальцы чуть дрожат. Кулон приятно холодит кожу.","",function(){S.love+=2;S.pend=1}],["Принять кулон и убрать в карман","v1a","cunning","","Вы благодарите, но кулон прячете: слишком уж он холодный.","",function(){S.love+=1;S.pend=1}],["Вежливо отказаться: подарок слишком дорог","v1a","wit","","{R} кивает, но на секунду в лице что-то мелькает. Что именно, вы не успеваете понять."]]};

G.v3={i:"night",t:["Огонёк разгорается. С потолка осыпается иней, лестница за вашей спиной замерзает ступень за ступенью.","«Помоги мне, — просит {R}. — Или не мешай. Больше мне ничего не нужно»."],c:[["Достучаться до {R}: напомнить всё, что между вами было",function(){return S.love>=3?"v4a":"b0"},"kind","","","",function(){S.r=S.love>=3?"Вы говорите о жабах, шарфе и ночи на подоконнике. Рука {R} медленно опускается.":"Слова не доходят: {R} качает головой. «Поздно», — шепчет {она|он}."}],["Снять кулон и вернуть {R}",function(){return S.love>=2?"v4a":"b0"},"","","","pend",function(){S.r=S.love>=2?"Вы кладёте кулон в ладонь {R}. Огонёк вздрагивает и тускнеет.":"Вы возвращаете кулон, но {R} лишь сжимает его в кулаке: «Это ничего не меняет»."}],["Атаковать, пока огонёк не набрал силу","b0","brave","","Вы вскидываете палочку первым."],["Позвать Миру: она уже листает книгу Эльзы","v4m","wit","","Мира выбегает из темноты, прижимая книгу к груди.","mi"],["Позвать Тео: его белая мышь уже у ног {R}","v4t","kind","","Белая мышь юркает по ступеням, а следом выбегает Тео, красный как свёкла.","te"],["Достать компас времени","v4c","wit","","Стрелка бешено вращается и замирает на огоньке.","compass"]]};

G.v4a={e:6,i:"portrait",t:["Огонёк гаснет сам. {R} опускается на колени: «Я так боя{лась|лся} потерять ещё кого-то…»","Вы остаётесь рядом до рассвета. В пустой раме рядом с портретом Орвина впервые мерцает тёплый свет. Замок снова живёт, а Эльм, говорят, наконец услышал, что его простили.","Вы не знаете, как это назвать: дружба или первая влюблённость. Но знаете, что это останется с вами надолго.","Конец. Спасибо, что играли."]};
G.v4b={e:6,i:"portrait",t:["Ваше последнее заклинание выбивает огонёк из ладоней {R}. Он катится по полу и гаснет.","{R} садится на пол и долго молчит. «Вы лучше, чем я думал{а|}», — наконец говорит {она|он} и уходит, не оглядываясь.","Замок цел. Но на шее осталась ледяная цепочка, а на сердце тоже. Эта победа вышла горькой.","Конец. Спасибо, что играли."]};
G.v4c={e:6,i:"portrait",t:["Стрелка компаса дёрнулась и повернула назад. Время дрогнуло, и огонёк в ладонях {R} осыпался пеплом.","«Что вы сделали?» — шепчет {R}. «Вернул[а|] часы на место», — отвечаете вы. Иней сходит со стен, и замок вдыхает впервые за триста лет.","{R} плачет, но уже не от боли. Эльм не вернулся, но вернулось время, и в нём у вас ещё много месяцев впереди.","Конец. Спасибо, что играли."]};
G.v4d={e:6,i:"portrait",t:["Вы падаете на колени. Холод подбирается к сердцу, и всё вокруг становится белым.","Из рамы раздаётся хриплый голос Орвина. Он выпускает остатки своего времени и закрывает огонёк собой. Свет гаснет. Портрет пустеет навсегда.","{R} опускается рядом и впервые не может сказать ни слова. Вы живы. Но цену этой ночи заплатил тот, кого вы едва начали понимать.","Конец. Спасибо, что играли."]};

G.v1a={i:"hall",t:function(){return["Утром в Большом зале Мира и Тео почти силой усаживают вас за стол. «Нам надо поговорить», — Мира кладёт перед вами потрёпанную книгу.","Тео шепчет: «{R} каждую ночь ходит на седьмой этаж. Моя мышь видела»."+(S.pend?" Мира косится на кулон и поджимает губы.":"")]},x:[["Открыть книгу","В хрониках Эльза Ренн значится не жертвой, а пропавшей вместе с учеником. Рядом выцветшая приписка: «последняя страница вырвана»."],["Угостить мышь Тео крошкой","Мышь берёт крошку, смотрит на вас умными красными глазами и, кажется, соглашается."]],c:[["Выслушать Миру: она нашла запись об Эльзе","v2","wit","","Мира выдыхает: «Спасибо, что слушаете. Я боялась, что вы не поверите».","",function(){fr("mira",2)}],["Взять белую мышь Тео на разведку","v2","cunning","","Тео сияет, будто ему вручили медаль. Мышь юркает в ваш рукав.","",function(){fr("teo",2)}],["Отмахнуться: «Вы просто ревнуете»","v2","brave","","Мира замолкает, Тео прячет глаза. Обедаете вы в тишине.","",function(){fr("mira",-1);fr("teo",-1)}]]};
G.v4m={e:6,i:"portrait",t:["Мира появляется на лестнице и задыхается: «Здесь есть последняя страница. Эльза писала не про месть, а про прощание».","Она читает вслух, и голубой огонёк в ладонях {R} дрожит, как свеча на сквозняке. Страница рассказывает, как отпустить время, не потеряв того, кого любишь. Эльм наконец уходит светом, а {R} плачет на плече у Миры.","«Всё-таки книги иногда спасают мир», — улыбается Мира впервые за год во весь рот.","Конец. Спасибо, что играли."]};
G.v4t={e:6,i:"portrait",t:["Белая мышь взбегает по руке {R}, цепляется за цепочку и сбивает огонёк в стакан с обычной водой, который Тео зачем-то носил в кармане.","Огонёк шипит и гаснет. «Я хотел поить мышь!» — оправдывается Тео. {R} смотрит на мышь, на стакан, на вас, и впервые за долгое время смеётся сквозь слёзы.","Иногда замок спасает не заклинание, а один маленький храбрый грызун. Тео получает от школы звание «Почётного укротителя мышей», а {R} учит вас делать горячий шоколад.","Конец. Спасибо, что играли."]};
